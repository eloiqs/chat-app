services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatapp}
      POSTGRES_DB: ${POSTGRES_DB:-chatapp_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-chatapp} -d ${POSTGRES_DB:-chatapp_dev}',
        ]
      interval: 5s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chatapp}:${POSTGRES_PASSWORD:-chatapp}@postgres:5432/${POSTGRES_DB:-chatapp_dev}
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '${SERVER_PORT:-3001}:${SERVER_PORT:-3001}'
    environment:
      PORT: ${SERVER_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-chatapp}:${POSTGRES_PASSWORD:-chatapp}@postgres:5432/${POSTGRES_DB:-chatapp_dev}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CORS_CREDENTIALS: 'true'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --spider http://localhost:${SERVER_PORT:-3001}/api/chats/users || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ws-gateway:
    build:
      context: .
      dockerfile: ws-gateway/Dockerfile
    ports:
      - '${WS_PORT:-3002}:${WS_PORT:-3002}'
    environment:
      PORT: ${WS_PORT:-3002}
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}
      SERVER_URL: http://server:${SERVER_PORT:-3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CORS_CREDENTIALS: 'true'
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started

  web-client:
    build:
      context: .
      dockerfile: web-client/Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:${SERVER_PORT:-3001}
        VITE_WS_URL: http://localhost:${WS_PORT:-3002}
    ports:
      - '${CLIENT_PORT:-5173}:80'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:80 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
