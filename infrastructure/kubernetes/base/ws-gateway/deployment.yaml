apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
  labels:
    app: chatapp
    component: ws-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatapp
      component: ws-gateway
  template:
    metadata:
      labels:
        app: chatapp
        component: ws-gateway
    spec:
      containers:
        - name: ws-gateway
          image: chatapp/ws-gateway:latest
          ports:
            - containerPort: 3002
              name: websocket
          env:
            - name: PORT
              value: "3002"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: chatapp-config
                  key: REDIS_URL
            - name: SERVER_URL
              value: "http://server:3001"
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: chatapp-config
                  key: CORS_ORIGINS
            - name: CORS_CREDENTIALS
              value: "true"
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
