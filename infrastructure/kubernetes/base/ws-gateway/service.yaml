apiVersion: v1
kind: Service
metadata:
  name: ws-gateway
  labels:
    app: chatapp
    component: ws-gateway
spec:
  type: ClusterIP
  # Enable session affinity for WebSocket connections
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP
      name: websocket
  selector:
    app: chatapp
    component: ws-gateway
