apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  labels:
    app: chatapp
    component: migrations
  annotations:
    # Helm hook annotations for use with Helm
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: chatapp
        component: migrations
    spec:
      serviceAccountName: migrations
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: chatapp/server:latest
          command:
            - sh
            - -c
            - |
              echo "Running database migrations..."
              npx prisma migrate deploy
              echo "Running database seed..."
              npx prisma db seed
              echo "Migrations completed successfully!"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chatapp-secrets
                  key: DATABASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
