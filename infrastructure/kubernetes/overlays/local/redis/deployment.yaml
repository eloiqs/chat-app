apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: chatapp
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatapp
      component: redis
  template:
    metadata:
      labels:
        app: chatapp
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
            - --appendonly
            - "yes"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
