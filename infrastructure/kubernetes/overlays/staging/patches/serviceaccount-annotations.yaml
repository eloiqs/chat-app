# Patch to add IRSA role ARN to service accounts
# Replace ACCOUNT_ID with your actual AWS account ID
apiVersion: v1
kind: ServiceAccount
metadata:
  name: server
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/chatapp-staging-server-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrations
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/chatapp-staging-migrations-role
