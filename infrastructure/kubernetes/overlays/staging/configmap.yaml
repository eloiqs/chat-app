apiVersion: v1
kind: ConfigMap
metadata:
  name: chatapp-config
  labels:
    app: chatapp
data:
  # These values will be set based on Terraform outputs
  REDIS_URL: "redis://ELASTICACHE_ENDPOINT:6379"
  # Update with actual ALB DNS name after deployment
  CORS_ORIGINS: "https://staging.chatapp.example.com,http://STAGING_ALB_DNS"
