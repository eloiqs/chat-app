name: Deploy to Staging

on:
  repository_dispatch:
    types: [deploy-staging]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: true
        default: 'latest'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: chatapp-staging
  NAMESPACE: chatapp-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/chatapp-staging-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Update Kustomize images
        run: |
          cd infrastructure/kubernetes/overlays/staging
          kustomize edit set image \
            chatapp/server=${{ steps.login-ecr.outputs.registry }}/chatapp/server:${{ steps.tag.outputs.tag }} \
            chatapp/ws-gateway=${{ steps.login-ecr.outputs.registry }}/chatapp/ws-gateway:${{ steps.tag.outputs.tag }} \
            chatapp/web-client=${{ steps.login-ecr.outputs.registry }}/chatapp/web-client:${{ steps.tag.outputs.tag }}

      - name: Run database migrations
        run: |
          # Delete old migration job if exists
          kubectl delete job db-migration -n ${{ env.NAMESPACE }} --ignore-not-found

          # Apply migration job
          kubectl apply -k infrastructure/kubernetes/base/migrations -n ${{ env.NAMESPACE }}

          # Wait for migration to complete
          kubectl wait --for=condition=complete job/db-migration -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Deploy to staging
        run: |
          kubectl apply -k infrastructure/kubernetes/overlays/staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/server -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/ws-gateway -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/web-client -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Get deployment status
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -n ${{ env.NAMESPACE }}

      - name: Run smoke tests
        run: |
          # Get the ALB URL
          ALB_URL=$(kubectl get ingress chatapp-ingress -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          echo "Testing ALB URL: http://${ALB_URL}"

          # Wait for ALB to be ready
          for i in {1..30}; do
            if curl -sf "http://${ALB_URL}/api/chats/users" > /dev/null; then
              echo "Smoke test passed!"
              exit 0
            fi
            echo "Waiting for ALB to be ready... (attempt $i/30)"
            sleep 10
          done

          echo "Smoke test failed!"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment to staging failed!"
          # Add Slack/Discord notification here
