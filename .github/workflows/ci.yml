name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build all workspaces
        run: npm run build

  e2e-tests:
    needs: lint-and-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatapp
          POSTGRES_PASSWORD: chatapp
          POSTGRES_DB: chatapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run database migrations
        run: npx prisma migrate deploy
        working-directory: server
        env:
          DATABASE_URL: postgresql://chatapp:chatapp@localhost:5432/chatapp_test

      - name: Seed database
        run: npx prisma db seed
        working-directory: server
        env:
          DATABASE_URL: postgresql://chatapp:chatapp@localhost:5432/chatapp_test

      - name: Start server
        run: npm run dev:server &
        env:
          DATABASE_URL: postgresql://chatapp:chatapp@localhost:5432/chatapp_test
          REDIS_URL: redis://localhost:6379
          PORT: 3001
          CORS_ORIGINS: http://localhost:5173

      - name: Start client
        run: npm run dev &
        env:
          VITE_SERVER_URL: http://localhost:3001
          VITE_WS_URL: http://localhost:3002

      - name: Wait for services
        run: |
          npx wait-on http://localhost:3001/api/chats/users -t 60000
          npx wait-on http://localhost:5173 -t 60000

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:5173

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: e2e/test-results/
          retention-days: 7
